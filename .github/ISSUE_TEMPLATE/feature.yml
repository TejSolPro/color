name: Feature proposal
description: Propose a focused improvement
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and trade-offs
      description: Include examples, standards, accessibility effects, or provenance concerns.
