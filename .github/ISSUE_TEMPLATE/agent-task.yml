name: Agent-ready task
description: Define a focused task that a maintainer or coding agent can implement.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for work that is sufficiently clear for a human or AI coding agent. Never include passwords, API keys, private data, or unlicensed source material.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and who does it affect?
      placeholder: Describe the user problem rather than only the proposed code change.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should be observably true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: List relevant files, compatibility needs, or decisions that must not change.
      placeholder: In scope, out of scope, and any public contracts to preserve.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Provide a short checklist that another person can verify.
      placeholder: |
        - [ ] Expected behavior is covered by tests
        - [ ] Accessibility implications are documented
        - [ ] Typecheck, tests, and build pass
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Accessibility, licensing, or provenance notes
      description: Identify relevant risks or write "None known."
    validations:
      required: true
